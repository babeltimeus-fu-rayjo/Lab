<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1220">
  <meta name="description" content="A collection of small, self-contained browser demos and interaction experiments.">
  <title>Lab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="./"><span aria-hidden="true">🧪</span> Lab</a>
      <p class="tagline">A collection of small, self-contained browser demos and interaction experiments. No install, no sign-up. Each one stands on its own.</p>
    </div>
  </header>

  <main class="wrap">
    <section aria-labelledby="demos-heading">
      <h2 id="demos-heading" class="section-title">Demos</h2>
      <ul class="demo-grid" id="demo-grid">
        <noscript><li class="demo-card"><div class="demo-card-inner"><p>Enable JavaScript to see the demos.</p></div></li></noscript>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Hosted on GitHub Pages · <a href="https://github.com/babeltimeus-fu-rayjo/Lab">Source</a></p>
      <p class="version" id="version"></p>
    </div>
  </footer>

  <script type="module">
    import { demos } from './assets/js/demos.js';

    const grid = document.getElementById('demo-grid');

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    for (const demo of demos) {
      const li = el('li', 'demo-card');
      const link = el('a', 'demo-card-link');
      link.href = demo.path;
      link.setAttribute('aria-label', `Open ${demo.title}`);

      link.append(el('div', 'demo-card-icon', demo.icon));
      const body = el('div', 'demo-card-body');
      body.append(el('h3', null, demo.title), el('p', null, demo.tagline));
      if (demo.tags?.length) {
        const tags = el('ul', 'tags');
        for (const tag of demo.tags) tags.append(el('li', null, tag));
        body.append(tags);
      }
      link.append(body, el('span', 'demo-card-cta', 'Open →'));
      li.append(link);
      grid.append(li);
    }

    // Placeholder so the page reads as a growing collection.
    const soon = el('li', 'demo-card soon');
    const inner = el('div', 'demo-card-inner');
    inner.append(el('div', 'demo-card-icon', '✨'), el('h3', null, 'More coming soon'), el('p', null, 'New demos land here as they are added to the collection.'));
    soon.append(inner);
    grid.append(soon);

    // Show which build is live, so it's easy to tell versions apart.
    // Locally the dev server serves a live version.json from the working tree;
    // in production (no build step) we fall back to the GitHub commits API for
    // the latest commit on main — which is what Pages deploys.
    const REPO = 'https://github.com/babeltimeus-fu-rayjo/Lab';
    const COMMITS_API = 'https://api.github.com/repos/babeltimeus-fu-rayjo/Lab/commits/main';
    const fmt = (when) =>
      when ? new Date(when).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : '';
    const show = (parts) => { document.getElementById('version').innerHTML = parts.join(' · '); };

    fetch('version.json', { cache: 'no-store' })
      .then((r) => (r.ok ? r.json() : null))
      .then((v) => {
        if (v && v.commit && v.commit !== 'unknown') {
          const href = v.fullCommit ? `${REPO}/commit/${v.fullCommit}` : REPO;
          const parts = [`Version <a href="${href}"><code>${v.commit}</code></a>`];
          const when = fmt(v.buildTime || v.commitTime);
          if (when) parts.push(`${v.local ? 'served' : 'deployed'} ${when}`);
          if (v.dirty) parts.push('<span class="warn">uncommitted changes</span>');
          show(parts);
          return;
        }
        return fetch(COMMITS_API, { headers: { Accept: 'application/vnd.github+json' } })
          .then((r) => (r.ok ? r.json() : null))
          .then((c) => {
            if (!c || !c.sha) return;
            const when = fmt(c.commit?.committer?.date || c.commit?.author?.date);
            const parts = [`Version <a href="${REPO}/commit/${c.sha}"><code>${c.sha.slice(0, 7)}</code></a>`];
            if (when) parts.push(`updated ${when}`);
            show(parts);
          });
      })
      .catch(() => {});
  </script>
</body>
</html>
